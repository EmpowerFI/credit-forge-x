[package]
name = "zcash-watcher"
version = "0.1.0"
edition = "2021"
description = "Receive-only Zcash watcher: finds shielded payments to a viewing key, with their memos"
publish = false

# Its own workspace: the repository root is the Anchor workspace, and the two
# dependency trees must not share a Cargo.lock.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:reqwest", "dep:anyhow"]

[dependencies]
# No proving circuits and no threads: the watcher only decrypts, and it has to build for wasm32.
orchard = { version = "0.15.3", default-features = false, features = ["std"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["std"] }
zcash_primitives = { version = "0.30.1", default-features = false, features = ["std"] }
zcash_keys = { version = "0.16.1", features = ["orchard", "sapling"] }
zcash_protocol = "0.10.5"
zcash_note_encryption = "0.4.2"
zip32 = "0.2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls"], optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[[bin]]
name = "zwatch"
required-features = ["native"]

[profile.release]
opt-level = "s"
lto = true
