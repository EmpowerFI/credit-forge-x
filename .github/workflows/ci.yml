# The first gate this repository has had. STUDY-SPLIT.md §9 argues for three;
# this is the first of them, and it is the one that has to exist before the
# package boundary in that study can be trusted.
#
# Deliberately not here yet:
#   - pgTAP (needs a database; it is the private repo's gate once platform/ moves)
#   - the browser checks (verify-*, ux-paths: need a dev server and a seeded database)
name: CI

on:
  push:
    branches: [main, hackathon]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The documented minimum. If it passes here it passes above.
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the golden vectors and vendored.test.ts, which is what stops
      # the engine copies under platform/supabase/functions/_shared/ from
      # drifting away from packages/ — a drift that would let the browser
      # explain a score the server did not compute.
      - run: npm test
      - run: npm run build

  functions:
    name: Edge Functions type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # deno test covers _shared/ only; deno-check covers the functions
      # themselves, which is where a half-added anchor kind hides. The checker
      # is plain Node with no dependencies, so it needs no install.
      - run: deno test --allow-read platform/supabase/functions/_shared/
      - run: node scripts/deno-check.mjs

  program:
    name: Anchor program, in LiteSVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The tests load the compiled program with
      #   include_bytes!("../../../target/deploy/empowerfi_audit.so")
      # so the SBF binary has to exist before `cargo test` compiles them. It is
      # a build artefact and gitignored, which is why a clean checkout cannot
      # skip this step -- the first version of this job did, and failed.
      #
      # cargo-build-sbf ships with the Solana CLI and is enough on its own: the
      # Anchor CLI is only needed for the IDL and for deploying, and neither is
      # wanted here. Pinned to the version the program is built with locally.
      - name: Cache the Solana toolchain
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: solana-3.1.13-${{ runner.os }}
      - name: Install the Solana toolchain
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.13/install)"
      - run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # --sbf-out-dir is given explicitly rather than relying on the default,
      # because the path the test hardcodes is the thing that has to match.
      # It also writes a throwaway keypair there, which nothing uses: the
      # program ID the tests run under comes from declare_id! in the source.
      - run: cargo-build-sbf --manifest-path programs/empowerfi-audit/Cargo.toml --sbf-out-dir target/deploy

      # LiteSVM runs the program in-process: no validator and no cluster.
      # 28 tests, about a second once the dependencies are cached.
      - run: cargo test -p empowerfi-audit
