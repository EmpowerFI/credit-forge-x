      "description": "EmpowerFI is productive-credit and impact intelligence infrastructure, built in Brazil. Sponsors of ESG, impact and entrepreneurship programs fund cohorts that communities run; EmpowerFI turns that execution into auditable evidence, qualifies credit opportunities from the same data, and routes them to domestic capital in reais or global capital in USDC on Solana. Businesses receive and repay in reais, by Pix. In the pilot, a regulated financial partner provides the capital and makes the credit decision.",
