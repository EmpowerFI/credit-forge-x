      "@type": "Organization",
      "@id": "https://empowerfi.io/#organization",

      "foundingDate": "2025",
      "description": "EmpowerFI builds credit infrastructure that connects global capital with underserved microbusinesses in emerging markets, starting with women entrepreneurs in Brazil.",

        "addressLocality": "São Paulo",
        "addressRegion": "SP",
        "addressCountry": "BR"
      },

        "https://x.com/empower_fi"
