    <title>EmpowerFI — Global capital. Local circulation. Measurable prosperity.</title>

    <meta property="og:type" content="website" />

    <meta name="twitter:description" content="EmpowerFI is building the capital infrastructure that connects productive businesses to local, domestic and global capital — local capital first, global capital where it adds capacity. Brazil first.">

    <!-- Static copy of the company identity, so a crawler that does not execute
         JavaScript still resolves EmpowerFI to a real legal entity. The /about
         route republishes this same node (same @id) at runtime, plus its FAQ. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://empowerfi.io/#organization",
      "name": "EmpowerFI",
      "legalName": "Daniele Rodrigues dos Santos Consultoria em Tecnologia da Informação LTDA",
      "url": "https://empowerfi.io",
      "logo": "https://empowerfi.io/favicon.png",
      "foundingDate": "2025",
      "description": "EmpowerFI is building the capital infrastructure that connects productive businesses and local economies to the best-fit sources of capital, built in Brazil. It qualifies productive capital demand, maps the capital instruments available to a business or a territory, allocates local and domestic capital first, and evaluates the qualified demand that remains underserved for additional global capital. Servicing, repayment and outcomes are measured after deployment. EmpowerFI holds no lending, P2P, investment, FX or local-currency licence, and regulated financial functions are expected to operate through regulated structures and partners.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "São Paulo",
        "addressRegion": "SP",
        "addressCountry": "BR"
      },
      "founder": {
        "@type": "Person",
        "name": "Daniele Rodrigues dos Santos",
        "jobTitle": "Founder & CEO"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "contato@empowerfi.io",
        "availableLanguage": ["Portuguese", "English"]
      },
      "sameAs": [
        "https://www.linkedin.com/company/empowerfi-finance",
        "https://www.instagram.com/empowerfi_community/",
        "https://x.com/empower_fi"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://empowerfi.io/#app",
      "name": "EmpowerFI",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Android, iOS",
      "url": "https://play.google.com/store/apps/details?id=com.empowerfi.app",
      "installUrl": "https://play.google.com/store/apps/details?id=com.empowerfi.app",
      "sameAs": [
        "https://play.google.com/store/apps/details?id=com.empowerfi.app",
        "https://apps.apple.com/br/app/empowerfi/id6795292900"
      ],
      "inLanguage": "pt-BR",
      "publisher": { "@id": "https://empowerfi.io/#organization" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
