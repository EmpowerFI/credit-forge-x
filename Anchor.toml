[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

# The program ID is fixed for the whole hackathon (PLAN_HACKATHON.md, D7).
# Its keypair lives outside the repo; copy it to target/deploy/ before building.
[programs.localnet]
empowerfi_audit = "4rqhxEwPiTd5CATztMfNmFfLaSntcmZPuzHKgmbESfRR"
empowerfi_rewards = "5cWTf64kSqVQSKJW3DoSCs6uyrcXXWXppCMd15yrjAgT"

[programs.devnet]
empowerfi_audit = "4rqhxEwPiTd5CATztMfNmFfLaSntcmZPuzHKgmbESfRR"
empowerfi_rewards = "5cWTf64kSqVQSKJW3DoSCs6uyrcXXWXppCMd15yrjAgT"

# Localnet by default so no command reaches devnet by accident; deploy with
# --provider.cluster devnet, and upgrade — never redeploy fresh.
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test -p empowerfi-audit -p empowerfi-rewards"

[hooks]
